<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Spin The Wheel by kim :P</title>
</head>
<body>

    <main>
        <div class="main-box">
            <div class="left-col">
                <h1>
                    Spin The Wheel by kim :P
                    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>
                </h1>
                <p>Add your items, hit spin, let the wheel decide. Simple as that.</p>

                <form>
                    <input type="text" name="input" id="input" placeholder="Enter item here">
                    <input type="submit" id="submit" value="Add">
                </form>

                <div id="result"></div>
                <p>When you're done adding your items, press here:</p>
                
                <button id="spinButton">Spin!</button>
              
            </div>

            <div class="wheel-section">
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="480" height="480"></canvas>
                </div>               
               
            </div>
        </div>

        <div class="items-box">
            <h2>Your items: <span class="action" id = "deleteAll">delete all?</span></h2>
            <ul id="items"></ul>
        </div>
    </main>

    <script defer src="./logic.js"></script>
    <script defer src="./theme.js"></script>
    <script defer src="./wheel.js"></script>
</body>
</html>
